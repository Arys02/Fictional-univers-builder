meta:
  experiment_name: gpt2_shakespear
  model_name: gpt2
  dataset: sheakspear
  notes: testing gpt2 implementation with shakespear dataset

tokenizer:
  tokenizer_type: bpe_custom
  vocab_size: 50257
  # always 50257 for gpt model checkpoints

model:
  n_embd: 512
  n_layers: 16
  n_head: 32
  dropout: 0.2
  block_size: 1024 # always 1024 for gpt model checkpoints

training:
  batch_size: 16
  train_steps: 10000
  eval_interval: 250
  eval_iters: 100
  lr: 2e-4
