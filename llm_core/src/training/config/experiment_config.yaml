meta:
  experiment_name: gpt2_shakespear
  model_name: gpt2
  dataset: sheakspear
  notes: testing gpt2 implementation with shakespear dataset

tokenizer:
  tokenizer_type: tiktoken
  vocab_size: 50257
  # always 50257 for gpt model checkpoints

model:
  n_embd: 768
  n_layers: 12
  n_head: 12
  dropout: 0
  block_size: 1024 # always 1024 for gpt model checkpoints
  pretrained: false

training:
  batch_size: 8
  total_batch_GA: 16384
  train_steps: 1000
  eval_interval: 20
  eval_iters: 50
  lr: 2e-4
  set_float32_opti: true
  set_autocast_opti: true
  split_ratio: 0.2


